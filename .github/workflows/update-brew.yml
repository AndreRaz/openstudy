name: Update Homebrew Formula

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: read

jobs:
  update-formula:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download SHA256SUMS
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --pattern "SHA256SUMS.txt" \
            --repo "${{ github.repository }}"
          cat SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse checksums
        id: sums
        run: |
          echo "linux_x64=$(grep 'linux-x64' SHA256SUMS.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(grep 'linux-arm64' SHA256SUMS.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "darwin_arm64=$(grep 'darwin-arm64' SHA256SUMS.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "darwin_x64=$(grep 'darwin-x64' SHA256SUMS.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Clone homebrew-tap
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/AndreRaz/homebrew-tap.git /tmp/tap
        env:
          GIT_TERMINAL_PROMPT: "0"

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          cat > /tmp/tap/Formula/openstudy.rb << RUBY
          class Openstudy < Formula
            desc "AI-powered academic assistant for university students"
            homepage "https://github.com/AndreRaz/openstudy"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/AndreRaz/openstudy/releases/download/$TAG/openstudy-darwin-arm64.zip"
                sha256 "${{ steps.sums.outputs.darwin_arm64 }}"
              end

              on_intel do
                url "https://github.com/AndreRaz/openstudy/releases/download/$TAG/openstudy-darwin-x64.zip"
                sha256 "${{ steps.sums.outputs.darwin_x64 }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/AndreRaz/openstudy/releases/download/$TAG/openstudy-linux-arm64.tar.gz"
                sha256 "${{ steps.sums.outputs.linux_arm64 }}"
              end

              on_intel do
                url "https://github.com/AndreRaz/openstudy/releases/download/$TAG/openstudy-linux-x64.tar.gz"
                sha256 "${{ steps.sums.outputs.linux_x64 }}"
              end
            end

            def install
              bin.install "openstudy"
              bin.install "setup-openstudy.sh" if File.exist?("setup-openstudy.sh")
            end

            def post_install
              setup = bin/"setup-openstudy.sh"
              system setup.to_s if setup.exist?
            end

            def caveats
              <<~EOS
                OpenStudy ha sido instalado con 4 agentes académicos:
                  • Neux Profesor     — tutorías, resúmenes, flashcards, exámenes
                  • Neux Tutor        — retroalimentación y análisis
                  • Neux Investigador — investigación académica profunda
                  • Neux Explorador   — navegación de archivos de estudio

                Necesitas configurar una API key:
                  openstudy providers login

                Para empezar:
                  openstudy
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/openstudy --version").strip
            end
          end
          RUBY

      - name: Push formula update
        working-directory: /tmp/tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/openstudy.rb
          git commit -m "feat: update openstudy to ${{ steps.version.outputs.version }}"
          git push
