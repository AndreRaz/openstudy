name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: openstudy-linux-x64.tar.gz
            pack: tar
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: openstudy-linux-arm64.tar.gz
            pack: tar
          - os: macos-14
            platform: darwin
            arch: arm64
            artifact: openstudy-darwin-arm64.zip
            pack: zip
          - os: macos-13
            platform: darwin
            arch: x64
            artifact: openstudy-darwin-x64.zip
            pack: zip
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: openstudy-windows-x64.zip
            pack: zip

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install

      - name: Build binary
        working-directory: packages/opencode
        env:
          OPENSTUDY_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${OPENSTUDY_VERSION#v}"
          OPENSTUDY_VERSION="$VERSION" bun run script/build.ts --single --skip-embed-web-ui --skip-install

      - name: Package (tar.gz)
        if: matrix.pack == 'tar'
        working-directory: packages/opencode
        run: |
          DIST_DIR=$(ls -d dist/opencode-*/bin 2>/dev/null | head -1)
          tar -czf ../../${{ matrix.artifact }} -C "$DIST_DIR" openstudy

      - name: Package (zip - unix)
        if: matrix.pack == 'zip' && matrix.platform != 'windows'
        working-directory: packages/opencode
        run: |
          DIST_DIR=$(ls -d dist/opencode-*/bin 2>/dev/null | head -1)
          cd "$DIST_DIR" && zip ../../../${{ matrix.artifact }} openstudy

      - name: Package (zip - windows)
        if: matrix.platform == 'windows'
        working-directory: packages/opencode
        shell: pwsh
        run: |
          $distDir = Get-ChildItem -Directory -Path dist -Filter "opencode-*" | Select-Object -First 1
          Compress-Archive -Path "$($distDir.FullName)\bin\openstudy.exe" -DestinationPath "../../${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          sha256sum openstudy-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create/Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/openstudy-linux-x64.tar.gz \
            artifacts/openstudy-linux-arm64.tar.gz \
            artifacts/openstudy-darwin-arm64.zip \
            artifacts/openstudy-darwin-x64.zip \
            artifacts/openstudy-windows-x64.zip \
            artifacts/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
