name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: openstudy-linux-x64.tar.gz
            pack: tar
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            artifact: openstudy-linux-arm64.tar.gz
            pack: tar
          - os: macos-14
            platform: darwin
            arch: arm64
            artifact: openstudy-darwin-arm64.zip
            pack: zip
          - os: macos-latest
            platform: darwin
            arch: x64
            artifact: openstudy-darwin-x64.zip
            pack: zip
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: openstudy-windows-x64.zip
            pack: zip

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install

      - name: Build binary
        working-directory: packages/opencode
        shell: bash
        env:
          OPENSTUDY_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${OPENSTUDY_VERSION#v}"
          OPENSTUDY_VERSION="$VERSION" bun run script/build.ts --single --skip-embed-web-ui --skip-install

      - name: Find dist directory
        id: dist
        shell: bash
        run: |
          DIST_DIR=$(find packages/opencode/dist -type d -name "bin" | head -1)
          echo "dir=$DIST_DIR" >> "$GITHUB_OUTPUT"
          echo "Found dist dir: $DIST_DIR"
          ls -la "$DIST_DIR"

      - name: Package (tar.gz)
        if: matrix.pack == 'tar'
        shell: bash
        run: |
          DIST="${{ steps.dist.outputs.dir }}"
          ITEMS=(openstudy setup-openstudy.sh setup-openstudy.ps1 setup-openstudy.cmd)
          [ -d "$DIST/skills" ] && ITEMS+=(skills)
          tar -czf ${{ matrix.artifact }} -C "$DIST" "${ITEMS[@]}"

      - name: Package (zip - unix)
        if: matrix.pack == 'zip' && matrix.platform != 'windows'
        shell: bash
        run: |
          DIST="${{ steps.dist.outputs.dir }}"
          cd "$DIST"
          ITEMS=(openstudy setup-openstudy.sh setup-openstudy.ps1 setup-openstudy.cmd)
          [ -d "skills" ] && ITEMS+=(skills)
          zip -r "$GITHUB_WORKSPACE/${{ matrix.artifact }}" "${ITEMS[@]}"

      - name: Package (zip - windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $binDir = "${{ steps.dist.outputs.dir }}"
          $items = @("$binDir\openstudy.exe", "$binDir\setup-openstudy.ps1", "$binDir\setup-openstudy.cmd")
          if (Test-Path "$binDir\skills") { $items += "$binDir\skills" }
          Compress-Archive -Path $items -DestinationPath "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Upload to Release

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          sha256sum openstudy-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenStudy ${GITHUB_REF_NAME}" \
            --notes "Automated release for ${GITHUB_REF_NAME}"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/openstudy-*.tar.gz \
            artifacts/openstudy-*.zip \
            artifacts/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    name: Publish to npm

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version
        working-directory: packages/npm

      - name: Publish to npm
        run: npm publish --access public
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
